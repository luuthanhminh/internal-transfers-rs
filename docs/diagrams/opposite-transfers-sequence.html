<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two opposite transfers, no deadlock</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · ordered row locking</p>
    <h1>Two opposite transfers at the same moment</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="opposite-transfers-sequence-title opposite-transfers-sequence-desc">
      <title id="opposite-transfers-sequence-title">Two opposite transfers, no deadlock</title>
      <desc id="opposite-transfers-sequence-desc">Sequence of two opposite transfers starting together: both request the row 1 lock first, so T2 waits while T1 locks row 2, commits and releases both rows; T2 then gets row 1, locks row 2 and commits on top of T1&#x27;s balances.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

<line x1="160" y1="96" x2="160" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

<line x1="592" y1="96" x2="592" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="832" y1="96" x2="832" y2="520" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="156" y="152" width="8" height="176" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="828" y="152" width="8" height="216" fill="#f5f5f5" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="3,2"/>
<rect x="828" y="368" width="8" height="128" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="396" y="152" width="8" height="144" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="396" y="368" width="8" height="128" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="588" y="200" width="8" height="128" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="588" y="416" width="8" height="80" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<text x="44" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.04em">[both start]</text>
<line x1="164" y1="152" x2="396" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="212" y="132" width="136" height="12" rx="2" fill="#f5f5f5"/>
<text x="280" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOCK · LOWEST ID FIRST</text>
<line x1="828" y1="152" x2="404" y2="152" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="652" y="132" width="120" height="12" rx="2" fill="#f5f5f5"/>
<text x="712" y="141" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOCK · WAITS FOR T1</text>
<line x1="164" y1="200" x2="588" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="280" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOCK</text>
<line x1="164" y1="296" x2="396" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="256" y="276" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="280" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE</text>

<rect x="672" y="348" width="80" height="12" rx="2" fill="#f5f5f5"/>
<text x="712" y="357" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOCK GRANTED</text>
<line x1="828" y1="416" x2="596" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="696" y="396" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="712" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOCK</text>
<rect x="76" y="228" width="168" height="28" rx="4" fill="#f5f5f5"/>

<text x="160" y="245" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">debit 1, credit 2, COMMIT</text>
<rect x="748" y="444" width="168" height="42" rx="4" fill="#f5f5f5"/>
<rect x="748" y="444" width="168" height="42" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<text x="832" y="461" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sees T1&#x27;s balances</text>
<text x="832" y="475" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">debit 2, credit 1, COMMIT</text>
<rect x="88" y="40" width="144" height="56" rx="6" fill="#f5f5f5"/>

<text x="160" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">transfer 1 → 2</text>
<rect x="328" y="40" width="144" height="56" rx="6" fill="#f5f5f5"/>
<rect x="328" y="40" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="336" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="350" y="55" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROW</text>
<text x="400" y="72" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">row 1</text>
<text x="400" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">account 1, lowest id</text>
<rect x="520" y="40" width="144" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="40" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="528" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
<text x="542" y="55" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROW</text>
<text x="592" y="72" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">row 2</text>
<text x="592" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">account 2</text>
<rect x="760" y="40" width="144" height="56" rx="6" fill="#f5f5f5"/>
<rect x="760" y="40" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="768" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>

<line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>

<text x="274" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Contended request</text>
<line x1="390" y1="570" x2="414" y2="570" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="426" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Release / grant</text>
<rect x="536" y="564" width="8" height="12" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<text x="556" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Active / lock held</text>
<rect x="681" y="564" width="8" height="12" fill="#f5f5f5" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="3,2"/>
<text x="701" y="572" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Waiting</text>
    </svg>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer transaction</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · src/db/transfers.rs</p>
    <h1>Transfer transaction</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="transfer-sequence-title transfer-sequence-desc">
      <title id="transfer-sequence-title">Transfer transaction</title>
      <desc id="transfer-sequence-desc">Sequence of the transfer transaction between the handler task and PostgreSQL: BEGIN with lock and statement timeouts, lock both rows in id order, claim the idempotency key with an INSERT, check balances under the lock, then either update both balances and COMMIT or ROLLBACK at the first failing check.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

<line x1="320" y1="96" x2="320" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="960" y1="96" x2="960" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="40" y="452" width="944" height="204" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<rect x="40" y="452" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<text x="60" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
<text x="52" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.04em">[checks 1 to 4 pass]</text>
<line x1="48" y1="604" x2="976" y2="604" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="52" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.04em">[a check fails]</text>
<rect x="316" y="132" width="8" height="516" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<rect x="956" y="140" width="8" height="504" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<line x1="324" y1="144" x2="956" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="424" y="124" width="432" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="133" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">BEGIN · SET LOCAL lock_timeout = &#x27;2s&#x27; · SET LOCAL statement_timeout = &#x27;10s&#x27;</text>
<line x1="324" y1="204" x2="956" y2="204" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="440" y="172" width="400" height="24" rx="2" fill="#f5f5f5"/>
<text x="640" y="181" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SELECT account_id, balance FROM accounts WHERE account_id = ANY($ids)</text>
<text x="640" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ORDER BY account_id FOR UPDATE</text>
<line x1="956" y1="244" x2="324" y2="244" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="540" y="224" width="200" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">both rows, locked lowest id first</text>
<line x1="324" y1="332" x2="956" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="412" y="300" width="456" height="24" rx="2" fill="#f5f5f5"/>
<text x="640" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INSERT INTO transactions … ON CONFLICT (idempotency_key) DO NOTHING RETURNING …</text>
<text x="640" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">claims the Idempotency-Key · no row comes back if the key is already taken</text>
<line x1="324" y1="512" x2="956" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="468" y="492" width="344" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="501" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UPDATE accounts SET balance = balance - $amount   (source)</text>
<line x1="324" y1="540" x2="956" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="456" y="520" width="368" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UPDATE accounts SET balance = balance + $amount   (destination)</text>
<line x1="324" y1="568" x2="956" y2="568" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="616" y="548" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="557" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">COMMIT</text>
<line x1="324" y1="644" x2="956" y2="644" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="452" y="624" width="376" height="12" rx="2" fill="#f5f5f5"/>
<text x="640" y="633" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ROLLBACK at the failing check · respond with that check&#x27;s status</text>
<rect x="48" y="256" width="248" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<rect x="56" y="264" width="12" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-width="0.8"/>
<text x="62" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
<text x="76" y="268" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">both rows exist</text>
<text x="76" y="279" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">fail → 404 account_not_found</text>
<rect x="48" y="344" width="248" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<rect x="56" y="352" width="12" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-width="0.8"/>
<text x="62" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">2</text>
<text x="76" y="356" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">INSERT returned a row</text>
<text x="76" y="367" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">fail → replay (201) or 422</text>
<rect x="48" y="376" width="248" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<rect x="56" y="384" width="12" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-width="0.8"/>
<text x="62" y="393" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">3</text>
<text x="76" y="388" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">locked source balance ≥ amount</text>
<text x="76" y="399" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">fail → 422 insufficient_funds</text>
<rect x="48" y="408" width="248" height="28" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<rect x="56" y="416" width="12" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-width="0.8"/>
<text x="62" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">4</text>
<text x="76" y="420" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">locked destination + amount &lt; 10^20</text>
<text x="76" y="431" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">fail → 422 balance_limit_exceeded</text>
<rect x="176" y="576" width="120" height="20" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
<text x="186" y="590" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">201 Created</text>
<text x="988" y="168" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" text-anchor="start" font-style="italic">40001, 40P01 or 55P03 at any step:</text>
<text x="988" y="186" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" text-anchor="start" font-style="italic">the whole transaction is re-run,</text>
<text x="988" y="204" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" text-anchor="start" font-style="italic">3 attempts, then 503 + Retry-After: 1</text>
<rect x="240" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="240" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="248" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
<text x="264" y="55" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TASK</text>
<text x="320" y="72" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Handler task</text>
<text x="320" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&amp;mut PgConnection</text>
<rect x="880" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="880" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="888" y="46" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
<text x="900" y="55" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
<text x="960" y="72" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">PostgreSQL</text>
<text x="960" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">READ COMMITTED</text>
<line x1="40" y1="672" x2="1240" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
<line x1="112" y1="694" x2="136" y2="694" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="148" y="696" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Statement</text>
<line x1="222" y1="694" x2="246" y2="694" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="258" y="696" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Return</text>
<line x1="317" y1="694" x2="341" y2="694" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<text x="353" y="696" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Lock and commit</text>
<rect x="459" y="688" width="20" height="12" rx="3" fill="#ffffff" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><rect x="463" y="690" width="8" height="8" rx="1" fill="transparent" stroke="#4f5d75" stroke-width="0.8"/>
<text x="487" y="696" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Check on the handler</text>
<rect x="619" y="686" width="28" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="633" y="697" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALT</text>
<text x="655" y="696" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Fragment</text>
<rect x="728" y="688" width="8" height="12" fill="#e7e8eb" stroke="#4f5d75" stroke-width="0.8"/>
<text x="748" y="696" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Activation</text>
    </svg>
  </div>
</body>
</html>

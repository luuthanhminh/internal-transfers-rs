[package]
name = "internal-transfers"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "HTTP service for transfers between internal accounts, backed by PostgreSQL"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "bigdecimal",
    "chrono",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["chrono"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }

[dev-dependencies]
futures = "0.3"
http-body-util = "0.1"
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"

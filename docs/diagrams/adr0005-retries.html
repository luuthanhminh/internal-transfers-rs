<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retry only provably rolled-back errors</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · ADR 0005</p>
    <h1>Retry only provably rolled-back errors</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr0005-retries-title adr0005-retries-desc">
      <title id="adr0005-retries-title">Retry only provably rolled-back errors</title>
      <desc id="adr0005-retries-desc">Flowchart showing a transfer transaction re-run with jittered backoff for up to 3 attempts only on SQLSTATE 40001, 40P01 or 55P03; exhausted retries, statement timeouts and pool exhaustion return 503 with Retry-After, commits return 201, business errors 404 or 422 are returned as is, and a lost connection returns 500 for the client to retry with its Idempotency-Key.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ARROWS (drawn first) -->
      <!-- run → outcome -->
      <line x1="200" y1="240" x2="256" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- outcome ↑ 201 -->
      <line x1="328" y1="192" x2="328" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- outcome ↓ business -->
      <line x1="328" y1="288" x2="328" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- outcome → which error -->
      <line x1="400" y1="240" x2="512" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- which error → attempt < 3 (coral: retryable) -->
      <line x1="656" y1="240" x2="744" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- which error ↑ 503 -->
      <line x1="584" y1="192" x2="584" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- attempt ↑ 503 (no) -->
      <line x1="816" y1="192" x2="816" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- which error ↓ 500 -->
      <line x1="584" y1="288" x2="584" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- attempt → loop back to run (coral: retry) -->
      <path d="M816,288 V472 Q816,480 808,480 H128 Q120,480 120,472 V264" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ARROW LABELS -->
      <rect x="336" y="144" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="366" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMMITTED</text>

      <rect x="336" y="320" width="84" height="24" rx="2" fill="#f5f5f5"/>
      <text x="378" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUSINESS ERROR</text>
      <text x="378" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">404 · 422</text>

      <rect x="412" y="220" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="456" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB / POOL ERROR</text>

      <rect x="648" y="204" width="104" height="28" rx="2" fill="#f5f5f5"/>
      <text x="700" y="215" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">40001 40P01 55P03</text>
      <text x="700" y="227" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROLLED BACK</text>

      <rect x="592" y="132" width="88" height="24" rx="2" fill="#f5f5f5"/>
      <text x="636" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">57014 TIMEOUT</text>
      <text x="636" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POOL EXHAUSTED</text>

      <rect x="824" y="144" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

      <rect x="592" y="320" width="92" height="24" rx="2" fill="#f5f5f5"/>
      <text x="638" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONNECTION LOST</text>
      <text x="638" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAYBE AT COMMIT</text>

      <rect x="716" y="444" width="88" height="28" rx="2" fill="#f5f5f5"/>
      <text x="760" y="455" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES · BACK OFF</text>
      <text x="760" y="467" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WITH JITTER</text>

      <!-- NODES -->
      <!-- Step: run the transfer -->
      <rect x="40" y="216" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run the transfer</text>
      <text x="120" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one DB transaction</text>

      <!-- Decision: outcome -->
      <polygon points="328,192 400,240 328,288 256,240" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Outcome?</text>

      <!-- Decision: which error -->
      <polygon points="584,192 656,240 584,288 512,240" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Which error?</text>

      <!-- Decision: attempt < 3 -->
      <polygon points="816,192 888,240 816,288 744,240" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="816" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Attempt &lt; 3?</text>

      <!-- End: 201 -->
      <rect x="248" y="64" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="328" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">201 Created</text>

      <!-- End: 503 -->
      <rect x="552" y="64" width="320" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="712" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">503 Service Unavailable</text>
      <text x="712" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">temporarily_unavailable · Retry-After: 1</text>

      <!-- End: business error -->
      <rect x="248" y="384" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="328" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Returned as is</text>
      <text x="328" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never retried</text>

      <!-- End: 500 -->
      <rect x="464" y="384" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="584" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">500 · outcome unknown</text>
      <text x="584" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">client retries with Idempotency-Key</text>

      <!-- LEGEND -->
      <line x1="40" y1="528" x2="920" y2="528" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="120" y="552" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="561" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Step</text>

      <polygon points="212,558 224,552 236,558 224,564" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="244" y="561" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Decision</text>

      <rect x="316" y="552" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="348" y="561" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Response to the client</text>

      <line x1="480" y1="558" x2="508" y2="558" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="516" y="561" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Retry path (provably rolled back)</text>

      <line x1="684" y1="558" x2="712" y2="558" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="720" y="561" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Branch</text>
    </svg>

  </div>
</body>
</html>

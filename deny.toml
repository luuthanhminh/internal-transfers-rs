# cargo-deny configuration: run with `cargo deny check` (CI job `security`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# RustSec advisory database. Vulnerable or yanked crates fail the check;
# unmaintained crates fail only when this workspace uses them directly.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only. Add one here only after reading it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# This service is not published (`publish = false`), so it needs no license field.
ignore = true

[bans]
# Duplicate versions are common in the async ecosystem: report, don't fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io; no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

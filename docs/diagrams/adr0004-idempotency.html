<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idempotency-Key claimed on the ledger row</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · ADR 0004</p>
    <h1>Idempotency-Key claimed on the ledger row</h1>

    <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr0004-idempotency-title adr0004-idempotency-desc">
      <title id="adr0004-idempotency-title">Idempotency-Key claimed on the ledger row</title>
      <desc id="adr0004-idempotency-desc">Sequence showing a transfer that claims key k1 with INSERT ON CONFLICT DO NOTHING and commits while its 201 response is lost, then a retry with the same body replayed as 201 with Idempotent-Replayed true before any lock, and a different body with the same key rejected with 422 idempotency_key_reused.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES: Client 160 · Service 480 · PostgreSQL 800 -->
      <line x1="160" y1="96" x2="160" y2="596" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="96" x2="480" y2="596" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="96" x2="800" y2="596" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ALT fragment: same key k1 retried -->
      <rect x="96" y="312" width="768" height="272" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="96" y="312" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="116" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <rect x="104" y="336" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[retry · same body]</text>
      <line x1="104" y1="488" x2="856" y2="488" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="104" y="500" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[different body]</text>

      <!-- ACTIVATION BARS -->
      <rect x="476" y="144" width="8" height="144" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="192" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="368" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="796" y="400" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="476" y="532" width="8" height="28" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: Client → Service POST with key -->
      <line x1="160" y1="144" x2="476" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="248" y="112" width="144" height="24" rx="2" fill="#f5f5f5"/>
      <text x="320" y="122" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /TRANSACTIONS</text>
      <text x="320" y="133" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDEMPOTENCY-KEY: K1</text>

      <!-- M2: Service → PG lock + claim key -->
      <line x1="484" y1="192" x2="796" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="552" y="160" width="176" height="24" rx="2" fill="#f5f5f5"/>
      <text x="640" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCK ACCOUNTS · INSERT (K1)</text>
      <text x="640" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ON CONFLICT DO NOTHING</text>

      <!-- M3: PG → Service row returned (return) -->
      <line x1="796" y1="224" x2="484" y2="224" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="576" y="204" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROW RETURNED · OWNS K1</text>

      <!-- M4: Service → PG balances + commit -->
      <line x1="484" y1="256" x2="796" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="572" y="236" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UPDATE BALANCES · COMMIT</text>

      <!-- M5: Service → Client 201 lost (dashed, ends in a cross) -->
      <line x1="476" y1="288" x2="232" y2="288" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <line x1="220" y1="280" x2="236" y2="296" stroke="#4f5d75" stroke-width="1.4"/>
      <line x1="220" y1="296" x2="236" y2="280" stroke="#4f5d75" stroke-width="1.4"/>
      <rect x="292" y="256" width="120" height="24" rx="2" fill="#f5f5f5"/>
      <text x="352" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">201 · RESPONSE LOST</text>
      <text x="352" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONNECTION DROPPED</text>

      <!-- M6: retry, same body -->
      <line x1="160" y1="368" x2="476" y2="368" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="248" y="348" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="357" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST · SAME BODY · K1</text>

      <!-- M7: Service → PG lookup by key -->
      <line x1="484" y1="400" x2="796" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="532" y="380" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SELECT LEDGER ROW WHERE KEY = K1</text>

      <!-- M8: PG → Service found (return) -->
      <line x1="796" y1="432" x2="484" y2="432" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="560" y="412" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="421" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOUND · BEFORE ANY LOCK</text>

      <!-- M9: Service → Client replay (headline, coral) -->
      <line x1="476" y1="464" x2="164" y2="464" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="232" y="432" width="176" height="24" rx="2" fill="#f5f5f5"/>
      <text x="320" y="442" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">201 · SAME TRANSFER</text>
      <text x="320" y="453" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDEMPOTENT-REPLAYED: TRUE</text>

      <!-- M10: different body, same key -->
      <line x1="160" y1="532" x2="476" y2="532" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="248" y="512" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="521" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST · OTHER BODY · K1</text>

      <!-- M11: 422 (return) -->
      <line x1="476" y1="560" x2="164" y2="560" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="240" y="540" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="549" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">422 IDEMPOTENCY_KEY_REUSED</text>

      <!-- NOTE over Service..PostgreSQL: key still in flight -->
      <rect x="400" y="608" width="480" height="48" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="640" y="628" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">First request with k1 still in flight</text>
      <text x="640" y="644" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">INSERT ON CONFLICT waits: commit → replay / 422 · rollback → proceeds</text>

      <!-- ACTORS -->
      <rect x="80" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="88" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="102" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="160" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="160" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chooses the key</text>

      <rect x="400" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="422" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service</text>
      <text x="480" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /transactions</text>

      <rect x="720" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="728" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="740" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="800" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="800" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UNIQUE idempotency_key</text>

      <!-- LEGEND -->
      <line x1="40" y1="676" x2="920" y2="676" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="700" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="120" y1="696" x2="148" y2="696" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="156" y="700" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP request</text>

      <line x1="252" y1="696" x2="280" y2="696" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="288" y="700" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">SQL query</text>

      <line x1="408" y1="696" x2="436" y2="696" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="444" y="700" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Return</text>

      <line x1="512" y1="696" x2="532" y2="696" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <line x1="532" y1="692" x2="540" y2="700" stroke="#4f5d75" stroke-width="1.4"/>
      <line x1="532" y1="700" x2="540" y2="692" stroke="#4f5d75" stroke-width="1.4"/>
      <text x="548" y="700" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Response lost</text>

      <line x1="652" y1="696" x2="680" y2="696" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="688" y="700" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Replay, no money moved</text>
    </svg>

  </div>
</body>
</html>

services:
  db:
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: transfers
      POSTGRES_DB: transfers
    # Host port is configurable so it never collides with a local PostgreSQL on 5432.
    ports:
      - "${DB_PORT:-56432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfers -d transfers"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://transfers:transfers@db:5432/transfers
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      LOG_FORMAT: ${LOG_FORMAT:-text}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # Time allowed for in-flight requests to drain after SIGTERM.
    stop_grace_period: 30s

  # HTTP load test (k6). Starts only with `--profile loadtest`; see `make loadtest`.
  k6:
    image: grafana/k6:1.8.2@sha256:00fdcebafbc86cb0137d429529b1caa401a02e09025f02fc74866fa6e2b004d8
    profiles: [loadtest]
    environment:
      BASE_URL: ${BASE_URL:-http://app:8080}
      PROFILE: ${PROFILE:-smoke}
      P95_MS: ${P95_MS:-250}
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_EXPORT: /results/report.html
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/results:/results
    command: ["run", "--summary-export=/results/summary.json", "/scripts/transfers.js"]

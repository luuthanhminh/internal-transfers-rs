<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locking in ascending id order cannot deadlock</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · ADR 0003</p>
    <h1>Locking in ascending id order cannot deadlock</h1>

    <svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adr0003-ordered-locks-title adr0003-ordered-locks-desc">
      <title id="adr0003-ordered-locks-title">Locking in ascending id order cannot deadlock</title>
      <desc id="adr0003-ordered-locks-desc">Sequence showing transfers U1 (1 to 2) and U2 (2 to 1) both asking for row 1 first, so U2 waits until U1 locks row 2 and commits, then U2 gets row 1 and row 2, sees U1's balances and commits; both transfers succeed.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES: U1 120 · Row 1 360 · Row 2 600 · U2 840 -->
      <line x1="120" y1="96" x2="120" y2="488" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="360" y1="96" x2="360" y2="488" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="600" y1="96" x2="600" y2="488" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="96" x2="840" y2="488" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ROW 1 FIRST region (coral focal 1) -->
      <rect x="64" y="120" width="832" height="108" rx="4" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="64" y="120" width="136" height="16" rx="2" fill="#f5f5f5" stroke="rgba(235,108,54,0.50)" stroke-width="1"/>
      <text x="132" y="132" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BOTH ASK ROW 1 FIRST</text>

      <!-- ROW LOCK BARS: U1 holds row 1 and row 2 until COMMIT, then U2 holds both -->
      <rect x="356" y="168" width="8" height="152" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="256" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="352" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="392" width="8" height="72" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: U1 locks row 1 -->
      <line x1="120" y1="168" x2="356" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="184" y="148" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOR UPDATE · GRANTED</text>

      <!-- M2: U2 asks for row 1 (lowest id) first, waits for U1 -->
      <line x1="840" y1="208" x2="364" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="648" y="188" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOR UPDATE · WAITS FOR U1</text>

      <!-- M3: U1 locks row 2 -->
      <line x1="120" y1="256" x2="596" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="184" y="236" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOR UPDATE · GRANTED</text>

      <!-- NOTE over U1: debit, credit, COMMIT -->
      <rect x="40" y="280" width="160" height="40" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="120" y="297" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">debit 1 · credit 2</text>
      <text x="120" y="311" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">COMMIT</text>

      <!-- M4: row 1 lock handed to U2 (return: dashed) -->
      <line x1="364" y1="352" x2="836" y2="352" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="440" y="332" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCK GRANTED</text>

      <!-- M5: U2 locks row 2 -->
      <line x1="840" y1="392" x2="604" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="664" y="372" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOR UPDATE · GRANTED</text>

      <!-- NOTE over U2: sees U1's balances, debit, credit, COMMIT -->
      <rect x="760" y="412" width="160" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="429" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sees U1's balances</text>
      <text x="840" y="443" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">debit 2 · credit 1</text>
      <text x="840" y="457" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">COMMIT</text>

      <!-- ACTORS -->
      <rect x="40" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="60" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TX</text>
      <text x="120" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">U1</text>
      <text x="120" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">transfer 1 → 2</text>

      <rect x="280" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="288" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="302" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROW</text>
      <text x="360" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Row 1</text>
      <text x="360" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">account_id = 1</text>

      <rect x="520" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="528" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="542" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROW</text>
      <text x="600" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Row 2</text>
      <text x="600" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">account_id = 2</text>

      <rect x="760" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="40" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="768" y="48" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="780" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TX</text>
      <text x="840" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">U2</text>
      <text x="840" y="87" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">transfer 2 → 1</text>

      <!-- LEGEND -->
      <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="120" y="532" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="144" y="541" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Transfer transaction</text>

      <rect x="272" y="532" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="296" y="541" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Account row</text>

      <rect x="396" y="528" width="8" height="20" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="412" y="541" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Row lock held</text>

      <line x1="520" y1="538" x2="548" y2="538" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="556" y="541" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">SELECT … FOR UPDATE</text>

      <line x1="664" y1="538" x2="692" y2="538" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="700" y="541" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Lock handed over</text>

      <rect x="792" y="532" width="28" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="828" y="541" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Same lock order</text>
    </svg>

  </div>
</body>
</html>

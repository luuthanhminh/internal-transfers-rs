name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 1" # weekly: new advisories appear without any code change
  workflow_dispatch:

permissions:
  contents: read  # every job only reads the repository (CodeQL adds its own)

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependencies: RustSec advisories, yanked crates, licenses, crate sources (deny.toml).
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # Secrets anywhere in the git history.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # The runtime image (Debian packages) - what lockfile scanners cannot see.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t internal-transfers:ci .
      - name: Trivy (HIGH and CRITICAL with a fix available)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.0
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress internal-transfers:ci

  # Static analysis of the Rust code (SAST). Findings appear under
  # Security -> Code scanning.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout
      security-events: write  # upload code scanning results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  # The workflows themselves: script injection, over-broad tokens, unpinned
  # actions, credential persistence.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec zizmor==1.31.1 zizmor --min-severity medium --format github .github/workflows
